apiVersion: observability.deckhouse.io/v1alpha1
kind: ClusterObservabilityDashboard
metadata:
  name: ai-inference-live
  annotations:
    metadata.deckhouse.io/category: AI Platform
    metadata.deckhouse.io/title: AI Inference / Live performance
spec:
  definition: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Метрики одного выбранного кластера: namespace/service разделяют модели и варианты. Inventory остаётся видимым до запуска движка. Для второго кластера откройте его Console и Prometheus. GPU-панели показывают устройства узла, не отдельные MPS-процессы.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "liveNow": true,
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "ai-inference",
        "vllm",
        "gpu",
        "hardfest"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": false,
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "includeAll": false,
            "label": "Prometheus",
            "multi": false,
            "name": "ds_prometheus",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "skipUrlSync": false,
            "type": "datasource"
          },
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prometheus}"
            },
            "definition": "query_result(max by(namespace,service)(kube_service_labels{label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\"} or label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or vllm:cache_config_info))",
            "query": {
              "qryType": 3,
              "query": "query_result(max by(namespace,service)(kube_service_labels{label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\"} or label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or vllm:cache_config_info))",
              "refId": "namespace"
            },
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "refresh": 2,
            "sort": 1,
            "regex": "/namespace=\"([^\"]+)\"/",
            "skipUrlSync": false
          },
          {
            "name": "inference_service",
            "label": "Inference service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prometheus}"
            },
            "definition": "query_result(max by(namespace,service)(kube_service_labels{label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\",namespace=~\"$namespace\"} or label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\",namespace=~\"$namespace\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or vllm:cache_config_info{namespace=~\"$namespace\"}))",
            "query": {
              "qryType": 3,
              "query": "query_result(max by(namespace,service)(kube_service_labels{label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\",namespace=~\"$namespace\"} or label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\",namespace=~\"$namespace\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or vllm:cache_config_info{namespace=~\"$namespace\"}))",
              "refId": "inference_service"
            },
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "refresh": 2,
            "sort": 1,
            "regex": "/service=\"([^\"]+)\"/",
            "skipUrlSync": false
          },
          {
            "current": {
              "selected": true,
              "text": "20",
              "value": "20"
            },
            "description": "Maximum number of series rendered in each multi-series chart.",
            "hide": 0,
            "includeAll": false,
            "label": "Chart series",
            "multi": false,
            "name": "series_limit",
            "options": [
              {
                "selected": false,
                "text": "10",
                "value": "10"
              },
              {
                "selected": true,
                "text": "20",
                "value": "20"
              },
              {
                "selected": false,
                "text": "50",
                "value": "50"
              }
            ],
            "query": "10,20,50",
            "skipUrlSync": false,
            "type": "custom"
          },
          {
            "name": "pod",
            "label": "Runtime pod",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prometheus}"
            },
            "definition": "query_result(max by(namespace,service,pod)(label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\",namespace=~\"$namespace\",label_ai_inference_deckhouse_io_inference_service=~\"$inference_service\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or label_replace(kube_pod_labels{namespace=~\"$namespace\",label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\",label_app_kubernetes_io_name=~\"$inference_service\",label_app_kubernetes_io_name!=\"\"},\"service\",\"$1\",\"label_app_kubernetes_io_name\",\"(.+)\") or vllm:cache_config_info{namespace=~\"$namespace\",service=~\"$inference_service\"}))",
            "query": {
              "qryType": 3,
              "query": "query_result(max by(namespace,service,pod)(label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\",namespace=~\"$namespace\",label_ai_inference_deckhouse_io_inference_service=~\"$inference_service\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or label_replace(kube_pod_labels{namespace=~\"$namespace\",label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\",label_app_kubernetes_io_name=~\"$inference_service\",label_app_kubernetes_io_name!=\"\"},\"service\",\"$1\",\"label_app_kubernetes_io_name\",\"(.+)\") or vllm:cache_config_info{namespace=~\"$namespace\",service=~\"$inference_service\"}))",
              "refId": "pod"
            },
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "refresh": 2,
            "sort": 1,
            "regex": "/pod=\"([^\"]+)\"/",
            "skipUrlSync": false
          },
          {
            "name": "node",
            "label": "GPU node",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prometheus}"
            },
            "definition": "label_values(DCGM_FI_DEV_XID_ERRORS,node)",
            "query": {
              "qryType": 1,
              "query": "label_values(DCGM_FI_DEV_XID_ERRORS,node)",
              "refId": "node"
            },
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "refresh": 1,
            "sort": 1,
            "regex": "",
            "skipUrlSync": false,
            "description": "Узел выбранного кластера. GPU-панели не зависят от готовности модели и показывают всю нагрузку узла."
          },
          {
            "name": "gateway_namespace",
            "label": "Gateway namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prometheus}"
            },
            "definition": "label_values({__name__=~\"bifrost_(success_requests_total|error_requests_total|upstream_requests_total)\"},namespace)",
            "query": {
              "qryType": 1,
              "query": "label_values({__name__=~\"bifrost_(success_requests_total|error_requests_total|upstream_requests_total)\"},namespace)",
              "refId": "gateway_namespace"
            },
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "refresh": 1,
            "sort": 1,
            "regex": "",
            "skipUrlSync": false
          },
          {
            "name": "gateway_model",
            "label": "Gateway model",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${ds_prometheus}"
            },
            "definition": "label_values({__name__=~\"bifrost_(success_requests_total|error_requests_total|upstream_requests_total)\",namespace=~\"$gateway_namespace\"},model)",
            "query": {
              "qryType": 1,
              "query": "label_values({__name__=~\"bifrost_(success_requests_total|error_requests_total|upstream_requests_total)\",namespace=~\"$gateway_namespace\"},model)",
              "refId": "gateway_model"
            },
            "hide": 0,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "refresh": 1,
            "sort": 1,
            "regex": "",
            "skipUrlSync": false
          }
        ]
      },
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m"
        ]
      },
      "timezone": "browser",
      "title": "AI Inference / Live performance",
      "uid": "ai-inference-live",
      "version": 4,
      "weekStart": "",
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 100,
          "panels": [],
          "title": "Inference fleet overview",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "description": "UP — все обнаруженные endpoint отдают /metrics. DOWN — хотя бы один endpoint недоступен. NO SCRAPE — цели нет: модель запускается, остановлена или сбор не настроен. Это не результат запроса к модели; намеренно выключенный сервис не объявляется неисправным.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "align": "auto",
                "cellOptions": {
                  "type": "color-background"
                },
                "filterable": true,
                "inspect": false
              },
              "decimals": 0,
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "index": 0,
                      "text": "DOWN"
                    },
                    "1": {
                      "color": "green",
                      "index": 1,
                      "text": "UP"
                    },
                    "-1": {
                      "color": "gray",
                      "index": 2,
                      "text": "NO SCRAPE"
                    }
                  },
                  "type": "value"
                }
              ],
              "max": 1,
              "min": -1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "gray",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 0
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "Service"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "auto"
                    }
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "id": 1,
          "options": {
            "cellHeight": "sm",
            "enablePagination": true,
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": false,
                "displayName": "Service"
              }
            ]
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(min by(namespace,service)(up{namespace=~\"$namespace\",service=~\"$inference_service\"}) and on(namespace,service) max by(namespace,service)(kube_service_labels{label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\",namespace=~\"$namespace\",service=~\"$inference_service\"} or label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\",namespace=~\"$namespace\",label_ai_inference_deckhouse_io_inference_service=~\"$inference_service\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or vllm:cache_config_info{namespace=~\"$namespace\",service=~\"$inference_service\"})) or on(namespace,service) (-1 * max by(namespace,service)(kube_service_labels{label_app_kubernetes_io_part_of=\"hardfest-gpu-workshop\",namespace=~\"$namespace\",service=~\"$inference_service\"} or label_replace(kube_pod_labels{label_ai_inference_deckhouse_io_managed=\"true\",namespace=~\"$namespace\",label_ai_inference_deckhouse_io_inference_service=~\"$inference_service\"},\"service\",\"$1\",\"label_ai_inference_deckhouse_io_inference_service\",\"(.+)\") or vllm:cache_config_info{namespace=~\"$namespace\",service=~\"$inference_service\"}))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{namespace}} / {{service}}",
              "range": false,
              "refId": "A"
            }
          ],
          "title": "Inference service inventory",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {
                  "namespace": 0,
                  "service": 1,
                  "Value": 2
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "service": "Service",
                  "Value": "Scrape"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "id": 101,
          "panels": [],
          "title": "vLLM: пропускная способность и задержка",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "description": "Completed requests excluding aborts and runtime errors.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "decimals": 2,
              "noValue": "No traffic",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 0,
            "y": 10
          },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(vllm:request_success_total{namespace=~\"$namespace\",service=~\"$inference_service\",pod=~\"$pod\",finished_reason!~\"abort|error\"}[$__rate_interval]))",
              "legendFormat": "Successful requests/s",
              "range": false,
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Successful requests/s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "description": "Только завершения с finished_reason=abort|error внутри vLLM. Не включает HTTP-ошибки до движка. Нет запросов — нет значения.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1,
              "noValue": "No traffic",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 4,
            "y": 10
          },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(vllm:request_success_total{namespace=~\"$namespace\",service=~\"$inference_service\",pod=~\"$pod\",finished_reason=~\"abort|error\"}[$__rate_interval])) / (sum(rate(vllm:request_success_total{namespace=~\"$namespace\",service=~\"$inference_service\",pod=~\"$pod\"}[$__rate_interval])) > 0)",
              "legendFormat": "Error ratio",
              "range": false,
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Engine abort / error ratio",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "description": "Prompt-processing throughput for the selected services.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "decimals": 1,
              "noValue": "No traffic",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 8,
            "y": 10
          },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(vllm:prompt_tokens_total{namespace=~\"$namespace\",service=~\"$inference_service\",pod=~\"$pod\"}[$__rate_interval]))",
              "legendFormat": "Input tokens/s",
              "range": false,
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Input tokens/s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "description": "Generation throughput for the selected services.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "decimals": 1,
              "noValue": "No traffic",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 12,
            "y": 10
          },
          "id": 8,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(vllm:generation_tokens_total{namespace=~\"$namespace\",service=~\"$inference_service\",pod=~\"$pod\"}[$__rate_interval]))",
              "legendFormat": "Output tokens/s",
              "range": false,
              "refId": "A",
              "instant": true
            }
          ],
          "title": "Output tokens/s",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${ds_prometheus}"
          },
          "description": "TTFT внутри vLLM включает ожидание в очереди и работу до первого токена. Не равно времени prefill и не включает весь путь браузер → gateway.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "decimals": 3,
              "noValue": "No traffic",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "red",
                    "value": 2
                  }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 5,
            "w": 4,
            "x": 16,
            "y": 10
          },
          "id": 9,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto",
            "wideLayout": true
          },
          "targets": [
