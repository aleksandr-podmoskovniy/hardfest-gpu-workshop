# Ready-to-paste order for the prepared workshop; reserve one free GPU first.
# Keep the service and model names unchanged. Creation requests GPUs:
# this CRD has no replicas/scaling field; keep the object absent until needed.
# This order does not pin the recipe or prove 256K streaming through WebUI.
apiVersion: ai.deckhouse.io/v1alpha1
kind: InferenceService
metadata:
  name: selectel-gemma31
  namespace: hardfest-demo
spec:
  inferenceServiceClassName: hardfest-selectel-gemma31
  model:
    src: ai-models
    ref:
      kind: Model
      name: gemma-4-31b
  launchStrategy: Latency
  resources:
    accelerator:
      deviceClasses: [hardfest-selectel-blackwell]
