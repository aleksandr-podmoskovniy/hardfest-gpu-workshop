<text x="32" y="500" class="body" text-anchor="start">Все 60 ответов корректны и завершились естественно. Выход — 13–14 токенов, лимит — 32 768.</text>
<text x="32" y="531" class="small" text-anchor="start">Один прогон, последовательные волны. Внутри каждой волны 10 запросов делят общий префикс.</text>
<text x="32" y="556" class="small" text-anchor="start">Cold: префикс отсутствовал перед волной. Это не десять независимых документов и не общий коэффициент ускорения.</text>
<text x="32" y="581" class="small" text-anchor="start">Прямой vLLM, без WebUI/Bifrost. Отличается весь профиль; выигрыш нельзя приписать только offload.</text>
<text x="32" y="615" class="small" text-anchor="start">SHA256: public raw 41ae4f1104d5c7bb; summary 2f42e819dee197f8; original raw 79e917b8f082f76b</text>
