<rect data-phase="continuation" x="937.698" y="754" width="105.341" height="31" fill="#d97706"/>
<text x="40" y="906" class="title" text-anchor="start">Что этот тест доказывает — и чего не доказывает</text>
<text x="40" y="941" class="body" text-anchor="start">Полные окна и длинный выход выдержаны. Приемлемую задержку обычного чата этот тест не подтверждает.</text>
<text x="40" y="972" class="small" text-anchor="start">Синтетика: ignore_eos=true, прямой vLLM API. Персональный путь WebUI → Bifrost проверяется отдельно.</text>
<text x="40" y="1000" class="small" text-anchor="start">A и B получили разный объём входа: по этим двум прогонам нельзя вычислять выигрыш от тюнинга.</text>
<text x="40" y="1028" class="small" text-anchor="start">TPOT — среднее время выходного токена после первого; одинаковые 32 768 токенов в каждом запросе.</text>
<text x="40" y="1064" class="small" text-anchor="start">Источник: клиентские отчёты + Prometheus · SHA256 client 5911c2ce4658ab7a · metrics d5f7cb5fd8434be9</text>
</svg>