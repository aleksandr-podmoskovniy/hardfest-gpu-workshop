<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
<title id="title">Gemma B · с тюнингом: предел ёмкости, 10 запросов</title>
<desc id="desc">Проверка полных контекстных окон. Ожидание первого токена и продолжительность генерации показаны отдельно для каждого запроса. Это не тест обычного чата.</desc>
<rect width="1400" height="1100" fill="#f5f7fb"/>
<style>text{font-family:Arial,sans-serif;fill:#172b4d}.body{font-size:18px}.small{font-size:16px}.title{font-size:28px;font-weight:700}.number{font-size:30px;font-weight:700}</style>
<text x="40" y="47" class="title" text-anchor="start">Gemma B · с тюнингом: 10 / 10 запросов завершены</text>
<text x="40" y="79" class="body" text-anchor="start">1 × RTX PRO 6000 на модель · Все 10 запросов поданы одновременно, не все выполнялись сразу.</text>
<text x="40" y="109" class="body" text-anchor="start">Каждый запрос: 229 376 входных + 32 768 выходных = 262 144 токенов.</text>
<rect x="40" y="134" width="315" height="96" rx="10" fill="white" stroke="#d8dfeb"/>
<text x="55" y="173" class="number" text-anchor="start">312 мин 36 с</text>
<text x="55" y="208" class="small" text-anchor="start">весь прогон</text>
<rect x="375" y="134" width="315" height="96" rx="10" fill="white" stroke="#d8dfeb"/>
<text x="390" y="173" class="number" text-anchor="start">255 мин 01 с</text>
<text x="390" y="208" class="small" text-anchor="start">максимум до первого токена</text>
<rect x="710" y="134" width="315" height="96" rx="10" fill="white" stroke="#d8dfeb"/>
<text x="725" y="173" class="number" text-anchor="start">109,3 мс</text>
<text x="725" y="208" class="small" text-anchor="start">средний TPOT движка</text>
<rect x="1045" y="134" width="315" height="96" rx="10" fill="white" stroke="#d8dfeb"/>
<text x="1060" y="173" class="number" text-anchor="start">2 из 10</text>
<text x="1060" y="208" class="small" text-anchor="start">пик активных, по метрикам</text>
<text x="40" y="278" class="title" text-anchor="start">Когда каждый запрос дождался ответа</text>
<text x="40" y="312" class="small" text-anchor="start">TTFT: от отправки до первого токена, включая очередь и prefill. Это не только время очереди.</text>
<rect x="40" y="336" width="20" height="16" fill="#2563eb"/>
<text x="70" y="350" class="small" text-anchor="start">До первого токена</text>
<rect x="350" y="336" width="20" height="16" fill="#d97706"/>
<text x="380" y="350" class="small" text-anchor="start">После первого токена, до завершения</text>
<path d="M155.00,385V810" stroke="#d8dfeb"/>
<text x="155.0" y="837" class="small" text-anchor="middle">0,0</text>
<path d="M377.00,385V810" stroke="#d8dfeb"/>
<text x="377.0" y="837" class="small" text-anchor="middle">62,5</text>
<path d="M599.00,385V810" stroke="#d8dfeb"/>
<text x="599.0" y="837" class="small" text-anchor="middle">125,0</text>
<path d="M821.00,385V810" stroke="#d8dfeb"/>
<text x="821.0" y="837" class="small" text-anchor="middle">187,6</text>
<path d="M1043.00,385V810" stroke="#d8dfeb"/>
<text x="1043.0" y="837" class="small" text-anchor="middle">250,1</text>
<path d="M1265.00,385V810" stroke="#d8dfeb"/>
<text x="1265.0" y="837" class="small" text-anchor="middle">312,6</text>
<text x="1265" y="863" class="small" text-anchor="end">минут от одновременной подачи</text>
