<text x="40" y="48" class="title">Qwen: полное окно выдержано. Первый токен — до 19 мин 59 с.</text>
<text x="40" y="80" class="label">2 × RTX PRO 6000 · TP2 · 160 GiB RAM-offload · 10 одновременно поданных запросов</text>
<text x="40" y="108" class="small">Каждый запрос: 229 376 входных + 32 768 выходных токенов. Синтетический тест, ignore_eos=true.</text>
