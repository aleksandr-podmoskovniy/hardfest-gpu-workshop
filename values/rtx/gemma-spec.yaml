fullnameOverride: rtx-gemma-tune
replicaCount: 0
image: REPLACE_RUNTIME_IMAGE@sha256:f7cb9820c7e92eb78a4b3f60033e240c87a16bf99117471aba347fdd69eaca2d
profile: gemma-spec-4k
nodeSelector:
  kubernetes.io/hostname: REPLACE_RTX_NODE
tolerations: []
dra:
  deviceClassName: REPLACE_GENERATED_RTX_DEVICECLASS
  count: 1
modelVolumes: []
modelRefs: [rtx-gemma-e2b, rtx-gemma-e2b-assistant]
resources:
  requests:
    cpu: "2"
    memory: 12Gi
    ephemeral-storage: 1Gi
  limits:
    memory: 18Gi
    ephemeral-storage: 8Gi
runtimeSize: 6Gi
shmSize: 6Gi
vllm:
  model: /data/modelcache/models/rtx-gemma-e2b
  served-model-name: rtx-gemma-tune
  host: 0.0.0.0
  port: 8000
  dtype: bfloat16
  language-model-only: true
  safetensors-load-strategy: lazy
  tensor-parallel-size: 1
  max-model-len: 4096
  max-num-seqs: 2
  gpu-memory-utilization: 0.9
  enforce-eager: false
  enable-prefix-caching: true
  enable-chunked-prefill: true
  max-num-batched-tokens: 512
  max-cudagraph-capture-size: 4
  speculative-config:
    method: mtp
    model: /data/modelcache/models/rtx-gemma-e2b-assistant
    num_speculative_tokens: 1
  kv-cache-dtype: fp8
  attention-backend: TRITON_ATTN
  kv-offloading-size: 4
  kv-offloading-backend: native
  reasoning-parser: gemma4
  tool-call-parser: gemma4
  enable-auto-tool-choice: true
  generation-config: vllm
extraEnv:
  - name: VLLM_USE_SIMPLE_KV_OFFLOAD
    value: "0"
networkPolicy:
  extraIngress: []
