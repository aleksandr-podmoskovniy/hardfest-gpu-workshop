# Use independently, not as an overlay on A or B.
fullnameOverride: selectel-gemma-cache
replicaCount: 0
image: REPLACE_RUNTIME_IMAGE@sha256:f7cb9820c7e92eb78a4b3f60033e240c87a16bf99117471aba347fdd69eaca2d
profile: gemma31-prefix-ram
nodeSelector:
  kubernetes.io/hostname: REPLACE_PRO6000_NODE
tolerations: []
dra:
  deviceClassName: REPLACE_GENERATED_PRO6000_DEVICECLASS
  count: 1
modelVolumes: []
modelRefs: [gemma-4-31b]
resources:
  requests:
    cpu: "4"
    memory: 92Gi
    ephemeral-storage: 1Gi
  limits:
    memory: 92Gi
    ephemeral-storage: 8Gi
runtimeSize: 6Gi
shmSize: 81Gi
vllm:
  model: /data/modelcache/models/gemma-4-31b
  served-model-name: selectel-gemma-cache
  host: 0.0.0.0
  port: 8000
  dtype: bfloat16
  language-model-only: true
  safetensors-load-strategy: lazy
  tensor-parallel-size: 1
  max-model-len: 262144
  max-num-seqs: 10
  gpu-memory-utilization: 0.9
  enforce-eager: true
  enable-prefix-caching: true
  # Same scheduler defaults as A; this stage changes KV storage.
  kv-cache-dtype: fp8
  attention-backend: TRITON_ATTN
  kv-offloading-size: 80
  kv-offloading-backend: native
  reasoning-parser: gemma4
  tool-call-parser: gemma4
  enable-auto-tool-choice: true
  generation-config: vllm
  sse-keep-alive-interval: 15
extraEnv:
  - name: VLLM_USE_SIMPLE_KV_OFFLOAD
    value: "0"
networkPolicy:
  extraIngress: []
