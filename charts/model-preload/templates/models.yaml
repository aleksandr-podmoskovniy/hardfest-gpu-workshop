{{- if .Values.enabled }}
{{- if or (contains "REPLACE_" .Values.image) (not (contains "@sha256:" .Values.image)) (contains "REPLACE_" .Values.storageClassName) }}
{{- fail "set model-fetch image digest and storageClassName before enabling preload" }}
{{- end }}
{{- $claims := dict }}
{{- range .Values.models }}
{{- if hasKey $claims .claimName }}
{{- fail "each model must have a distinct claimName; concurrent delivery to one PVC is forbidden" }}
{{- end }}
{{- $_ := set $claims .claimName true }}
{{- if contains "REPLACE_" (toJson .) }}
{{- fail "replace model preload placeholders" }}
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .claimName }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ $.Values.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .size | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $.Release.Name }}-{{ .name }}-{{ $.Values.generation }}
  namespace: {{ $.Release.Namespace }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: model-preload
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml $.Values.tolerations | nindent 8 }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: download
          image: {{ $.Values.image | quote }}
          command: [/usr/bin/python3, -m, fetch_model]
          env:
            - {name: TARGET_PATH, value: /data}
            - {name: EXPECTED_MODEL, value: {{ .repo | quote }}}
            - {name: MODEL_ID, value: {{ .repo | quote }}}
            - {name: COMPLETE_MARKER, value: .download-complete}
            - {name: MAX_DOWNLOAD_ATTEMPTS, value: "3"}
            - {name: RETRY_DELAY_SECONDS, value: "30"}
            - {name: HF_HOME, value: /data/.hf}
            {{- with .assistant }}
            - {name: ASSISTANT_MODEL_ID, value: {{ .repo | quote }}}
            - {name: ASSISTANT_REVISION, value: {{ .revision | quote }}}
            {{- end }}
            {{- if $.Values.hfTokenSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $.Values.hfTokenSecret }}, key: token}
            {{- end }}
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits: {cpu: "2", memory: {{ .memoryLimit | default "3Gi" }}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: models, mountPath: /data}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .claimName }}
{{- end }}
{{- end }}
