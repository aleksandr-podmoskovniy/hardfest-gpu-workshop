apiVersion: v1
kind: Service
metadata:
  name: {{ include "vllm.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "vllm.name" . | quote }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
