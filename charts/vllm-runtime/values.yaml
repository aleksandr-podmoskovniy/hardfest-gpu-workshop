# Use exactly one values/<profile>.yaml, then your private site values.
fullnameOverride: ""
replicaCount: 0
profile: custom
image: vllm/vllm-openai@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
imagePullSecrets: []
nodeSelector: {}
tolerations: []
dra:
  deviceClassName: REPLACE_GENERATED_DEVICECLASS
  count: 1
  selectors: []
  capacity: {}
  config: []
modelVolumes: []
modelRefs: []
resources:
  requests:
    cpu: "4"
    memory: 24Gi
    ephemeral-storage: 4Gi
  limits:
    memory: 48Gi
    ephemeral-storage: 24Gi
shmSize: 8Gi
runtimeSize: 20Gi
vllm:
  model: /models/model
  served-model-name: REPLACE_MODEL
  host: 0.0.0.0
  port: 8000
extraEnv: []
networkPolicy:
  # Same-namespace clients. Add narrowly scoped Bifrost/monitoring peers in site values.
  extraIngress: []
