replicaCount: 0
name: webui-access
image: registry.example.com/integrations/webui-access:0.2.1
imagePullSecrets: []
existingSecret: webui-access
caConfigMap: ""
config:
  webui_url: http://open-webui:8080
  gateway_url: https://gateway.example.com
  service_user_id: REPLACE_WITH_WEBUI_SERVICE_USER_ID
  managed_by: REPLACE_WITH_INSTALLATION_ID
  key_name_prefix: Open WebUI
  provisioning_mode: create
  chat_models: []
  providers: []
  pricing: []
  budget_usd: 10
  budget_reset: 24h
  requests_per_minute: 10
  tokens_per_minute: 200000
  max_concurrent_total: 8
  max_concurrent_per_user: 1
  reconcile_interval_seconds: 15
webuiSelector:
  app.kubernetes.io/component: open-webui
  app.kubernetes.io/instance: open-webui
