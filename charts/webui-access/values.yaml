replicaCount: 0
name: hardfest-webui-access
image: registry.example.com/workshop/webui-access:0.1.0
imagePullSecrets: []
existingSecret: hardfest-webui-access
caConfigMap: ""
config:
  webui_url: http://open-webui:8080
  gateway_url: https://gateway.example.com
  service_user_id: REPLACE_WITH_WEBUI_SERVICE_USER_ID
  chat_models: [vllm/hardfest-gemma-a, vllm/hardfest-gemma-b]
  allowed_models: [hardfest-gemma-a, hardfest-gemma-b, gemma-4-31b]
  provider_key_ids: [REPLACE_WITH_ROUTE_A_ID, REPLACE_WITH_ROUTE_B_ID]
  price_models: [gemma-4-31b, hardfest-gemma-a, hardfest-gemma-b]
  budget_usd: 500
  budget_reset: 24h
  input_usd_per_million_tokens: 10
  output_usd_per_million_tokens: 20
  requests_per_minute: 10
  tokens_per_minute: 200000
  max_concurrent_total: 8
webuiSelector:
  app.kubernetes.io/component: open-webui
  app.kubernetes.io/instance: open-webui
