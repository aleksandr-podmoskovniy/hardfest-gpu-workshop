{{- if or (lt (int .Values.replicaCount) 0) (gt (int .Values.replicaCount) 1) }}
{{- fail "webui-access supports zero or one replica; multi-replica key allocation needs a distributed lock" }}
{{- end }}
{{- if or (and .Values.persistence.enabled (ne .Values.config.state_dir "/state")) (and (not .Values.persistence.enabled) .Values.config.state_dir) }}
{{- fail "durable issuance requires persistence.enabled and config.state_dir=/state together" }}
{{- end }}
{{- if and .Values.persistence.enabled (ne .Values.config.provisioning_mode "create") }}
{{- fail "durable issuance requires create mode" }}
{{- end }}
{{- if or .Values.config.issuer_user_id (gt (int (.Values.config.issuer_user_access_profile_id | default 0)) 0) }}
{{- if or (not .Values.config.issuer_user_id) (le (int (.Values.config.issuer_user_access_profile_id | default 0)) 0) (ne .Values.config.provisioning_mode "create") }}
{{- fail "native issuance requires issuer_user_id, positive issuer_user_access_profile_id and create mode" }}
{{- end }}
{{- end }}
{{- if eq (int .Values.replicaCount) 1 }}
{{- if or (not .Values.config.providers) (not .Values.config.chat_models) (contains "REPLACE" (.Values.config | toJson)) }}
{{- fail "configure explicit providers, chat models and installation identity before starting webui-access" }}
{{- end }}
{{- if not (regexMatch "@sha256:[a-f0-9]{64}$" .Values.image) }}
{{- fail "pin the webui-access image by digest before starting" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}
data:
  config.json: {{ .Values.config | toJson | quote }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-state
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        checksum/config: {{ .Values.config | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- if .Values.persistence.enabled }}
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bridge
          image: {{ .Values.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- if .Values.caConfigMap }}
          env:
            - name: SSL_CERT_DIR
              value: /etc/webui-access-ca:/etc/ssl/certs
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: state
              mountPath: /state
            {{- end }}
            - name: config
              mountPath: /config
              readOnly: true
            {{- if .Values.caConfigMap }}
            - name: ca
              mountPath: /etc/webui-access-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: state
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-state" .Values.name) }}
        {{- end }}
        {{- if .Values.caConfigMap }}
        - name: ca
          configMap:
            name: {{ .Values.caConfigMap }}
        {{- end }}
        - name: config
          configMap:
            name: {{ .Values.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.webuiSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
        - {protocol: TCP, port: 443}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.webuiSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8080}
