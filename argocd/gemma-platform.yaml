apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hardfest-gemma-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/team/k8s-config.git
    targetRevision: hardfest-demo
    path: argo-projects/gpu-cluster/hardfest-demo/charts/inference-service
    helm:
      releaseName: hf-platform-gemma
      valueFiles:
        - ../../platform/gemma.yaml
  destination:
    name: gpu-cluster
    namespace: hardfest-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
