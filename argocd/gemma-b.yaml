apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hardfest-gemma-b
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/team/k8s-config.git
    targetRevision: hardfest-demo
    path: argo-projects/gpu-cluster/hardfest-demo/charts/vllm-runtime
    helm:
      releaseName: hf-gemma-b
      valueFiles:
        - ../../values/gemma-b-spec.yaml
        - ../../site/gemma-assistant.yaml
  destination:
    name: gpu-cluster
    namespace: hardfest-demo
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: hf-gemma-b
      jsonPointers: [/spec/replicas]
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
