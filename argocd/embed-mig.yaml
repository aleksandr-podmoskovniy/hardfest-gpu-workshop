apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hardfest-embed-mig
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/team/k8s-config.git
    targetRevision: hardfest-demo
    path: argo-projects/gpu-cluster/hardfest-demo/charts/vllm-runtime
    helm:
      releaseName: hf-embed-mig
      valueFiles:
        - ../../values/embed-mig.yaml
        - ../../site/embed-mig.yaml
  destination:
    name: cluster-with-a30
    namespace: hardfest-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true
