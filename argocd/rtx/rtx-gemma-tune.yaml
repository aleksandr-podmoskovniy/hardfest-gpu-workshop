apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rtx-gemma-tune
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/team/k8s-config.git
    targetRevision: hardfest-rtx
    path: argo-projects/gpu-cluster/hardfest-rtx/charts/vllm-runtime
    helm:
      releaseName: rtx-gemma-tune
      valueFiles:
        - ../../values/gemma-spec.yaml
  destination:
    name: gpu-cluster
    namespace: hardfest-rtx
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rtx-gemma-tune
      jsonPointers: [/spec/replicas]
  syncPolicy:
    syncOptions: [CreateNamespace=false, ServerSideApply=true, RespectIgnoreDifferences=true, FailOnSharedResource=true]
