apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hardfest-qwen-tp2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/team/k8s-config.git
    targetRevision: hardfest-demo
    path: argo-projects/gpu-cluster/hardfest-demo/charts/vllm-runtime
    helm:
      releaseName: hf-qwen-tp2
      valueFiles:
        - ../../values/qwen-tp2.yaml
        - ../../site/qwen-tp2.yaml
  destination:
    name: gpu-cluster
    namespace: hardfest-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - PruneLast=true
