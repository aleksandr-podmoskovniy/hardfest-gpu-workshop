apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hardfest-pro6000-gemma-a
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.example.com/team/k8s-config.git
    targetRevision: hardfest-pro6000
    path: argo-projects/gpu-cluster/hardfest-pro6000/charts/vllm-runtime
    helm:
      releaseName: selectel-gemma-a
      valueFiles:
        - ../../values/gemma-a.yaml
        - ../../site/pro6000.yaml
  destination:
    name: gpu-cluster
    namespace: hardfest-demo
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: selectel-gemma-a
      jsonPointers: [/spec/replicas]
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
      - FailOnSharedResource=true
