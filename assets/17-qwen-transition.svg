<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">От двух Gemma к одному Qwen</title><desc id="desc">WebUI, Bifrost и базы знаний остаются; обе H100 переходят одному сервису.</desc>
<defs><marker id="arrow-1554dc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1554dc"/></marker><marker id="arrow-087d78" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087d78"/></marker><marker id="arrow-7041b8" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7041b8"/></marker><marker id="arrow-536278" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536278"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">От двух Gemma к одному Qwen</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">WebUI, Bifrost и базы знаний остаются; обе H100 переходят одному сервису.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="178" font-size="19" fill="#536278" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">1 / ОСВОБОДИТЬ GPU</tspan>
</text>
<rect x="48" y="204" width="532" height="114" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="246" font-size="25" fill="#536278" text-anchor="start" font-weight="700" data-max-width="484">
<tspan x="72" dy="0">Gemma A</tspan>
</text>
<text x="72" y="286" font-size="22" fill="#17243b" text-anchor="start" data-max-width="484">
<tspan x="72" dy="0">replicaCount: 0 → commit → sync</tspan>
</text>
<rect x="620" y="204" width="532" height="114" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="644" y="246" font-size="25" fill="#536278" text-anchor="start" font-weight="700" data-max-width="484">
<tspan x="644" dy="0">Gemma B</tspan>
</text>
<text x="644" y="286" font-size="22" fill="#17243b" text-anchor="start" data-max-width="484">
<tspan x="644" dy="0">replicaCount: 0 → commit → sync</tspan>
</text>
<text x="48" y="355" font-size="22" fill="#536278" text-anchor="start">
<tspan x="48" dy="0">Платформенную Gemma, если запущена, тоже остановить.</tspan>
</text>
<text x="48" y="419" font-size="19" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">2 / СОЗДАТЬ СЕРВИС ЧЕРЕЗ AI INFERENCE</tspan>
</text>
<rect x="48" y="447" width="336" height="143" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="489" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="288">
<tspan x="72" dy="0">Рецепт Qwen</tspan>
</text>
<text x="72" y="529" font-size="22" fill="#17243b" text-anchor="start" data-max-width="288">
<tspan x="72" dy="0">Throughput</tspan>
<tspan x="72" dy="30.799999999999997">TP2 + MTP + CPU KV</tspan>
</text>
<path d="M390 518.5 L426 518.5" fill="none" stroke="#1554dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-1554dc)" data-connector="true"/>
<rect x="432" y="447" width="336" height="143" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="456" y="489" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="288">
<tspan x="456" dy="0">DRA-заявка</tspan>
</text>
<text x="456" y="529" font-size="22" fill="#17243b" text-anchor="start" data-max-width="288">
<tspan x="456" dy="0">count: 2</tspan>
<tspan x="456" dy="30.799999999999997">Полные H100 одной ноды</tspan>
</text>
<path d="M774 518.5 L810 518.5" fill="none" stroke="#1554dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-1554dc)" data-connector="true"/>
<rect x="816" y="447" width="336" height="143" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="840" y="489" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="288">
<tspan x="840" dy="0">Qwen API</tspan>
</text>
<text x="840" y="529" font-size="22" fill="#17243b" text-anchor="start" data-max-width="288">
<tspan x="840" dy="0">Один Pod</tspan>
<tspan x="840" dy="30.799999999999997">Ответ через прежний чат</tspan>
</text>
<text x="48" y="656" font-size="27" fill="#17243b" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Перед запуском: прежние Pod завершены, обе GPU свободны.</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="18" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">PVC, веса, GPUClass/GPUPool и поисковые сервисы на A30 при переключении не удаляются.</tspan>
</text>
