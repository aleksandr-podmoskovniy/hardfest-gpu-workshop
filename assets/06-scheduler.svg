<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Длинный вход не обязан занимать весь шаг</title><desc id="desc">Схема работы планировщика. Размеры блоков условные, не длительность измерений.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="628" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">Длинный вход не обязан занимать весь шаг</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Схема работы планировщика. Размеры блоков условные, не длительность измерений.</tspan>
</text>
<text x="48" y="155" font-size="26" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Без чанкирования</tspan>
</text>
<rect x="48" y="175" width="760" height="70" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="428" y="219" font-size="27" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="428" dy="0">Весь длинный prefill</tspan>
</text>
<rect x="828" y="175" width="324" height="70" rx="14" fill="#fff2da" stroke="#a15b0b" stroke-width="2"/>
<text x="990" y="219" font-size="26" fill="#a15b0b" text-anchor="middle" font-weight="700">
<tspan x="990" dy="0">Decode ждёт</tspan>
</text>
<text x="48" y="297" font-size="26" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">С чанкированием</tspan>
</text>
