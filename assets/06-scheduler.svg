<text x="131" y="364" font-size="24" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="131" dy="0">Prefill 1</tspan>
</text>
<rect x="222" y="320" width="90" height="70" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="267" y="364" font-size="28" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="267" dy="0">D</tspan>
</text>
<rect x="328" y="320" width="166" height="70" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="411" y="364" font-size="24" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="411" dy="0">Prefill 2</tspan>
</text>
<rect x="502" y="320" width="90" height="70" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="547" y="364" font-size="28" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="547" dy="0">D</tspan>
</text>
<rect x="608" y="320" width="166" height="70" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="691" y="364" font-size="24" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="691" dy="0">Prefill 3</tspan>
</text>
<rect x="782" y="320" width="90" height="70" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="827" y="364" font-size="28" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="827" dy="0">D</tspan>
</text>
<rect x="888" y="320" width="166" height="70" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="971" y="364" font-size="24" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="971" dy="0">Prefill 4</tspan>
</text>
<rect x="1062" y="320" width="90" height="70" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="1107" y="364" font-size="28" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="1107" dy="0">D</tspan>
</text>
<text x="48" y="429" font-size="24" fill="#252528" text-anchor="start">
<tspan x="48" dy="0">D — генерация токенов уже начатых ответов между порциями входа.</tspan>
</text>
<rect x="48" y="464" width="352" height="108" rx="14" fill="#f1f4f8" stroke="#cbd5e1" stroke-width="2"/>
<text x="64" y="496" font-size="21" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">max-model-len</tspan>
</text>
<text x="64" y="526" font-size="20" fill="#252528" text-anchor="start">
<tspan x="64" dy="0">Вход + генерация</tspan>
<tspan x="64" dy="27.0">одной истории</tspan>
</text>
<rect x="424" y="464" width="352" height="108" rx="14" fill="#f1f4f8" stroke="#cbd5e1" stroke-width="2"/>
<text x="440" y="496" font-size="21" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="440" dy="0">max-num-seqs</tspan>
</text>
<text x="440" y="526" font-size="20" fill="#252528" text-anchor="start">
<tspan x="440" dy="0">Последовательности</tspan>
<tspan x="440" dy="27.0">в работе</tspan>
</text>
<rect x="800" y="464" width="352" height="108" rx="14" fill="#f1f4f8" stroke="#cbd5e1" stroke-width="2"/>
<text x="816" y="496" font-size="21" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="816" dy="0">max-num-batched-tokens</tspan>
</text>
<text x="816" y="526" font-size="20" fill="#252528" text-anchor="start">
<tspan x="816" dy="0">Токены одного шага</tspan>
<tspan x="816" dy="27.0">планировщика</tspan>
</text>
<text x="48" y="602" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">CUDA graphs уменьшают накладные расходы запусков, но не заменяют планировщик и занимают HBM.</tspan>
</text>
</svg>
