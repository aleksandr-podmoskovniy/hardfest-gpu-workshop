<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Две карты — один экземпляр большой модели</title><desc id="desc">Финальный эксперимент после освобождения обеих H100. Запуск и скорость проверяются отдельно.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="498" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">Две карты — один экземпляр большой модели</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Финальный эксперимент после освобождения обеих H100. Запуск и скорость проверяются отдельно.</tspan>
</text>
<rect x="48" y="164" width="410" height="174" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="70" y="203" font-size="27" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="70" dy="0">H100 №1</tspan>
</text>
<text x="70" y="240" font-size="22" fill="#252528" text-anchor="start">
<tspan x="70" dy="0">Часть весов и KV</tspan>
<tspan x="70" dy="29.700000000000003">Процесс TP rank 0</tspan>
</text>
<rect x="742" y="164" width="410" height="174" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="764" y="203" font-size="27" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="764" dy="0">H100 №2</tspan>
</text>
<text x="764" y="240" font-size="22" fill="#252528" text-anchor="start">
<tspan x="764" dy="0">Часть весов и KV</tspan>
<tspan x="764" dy="29.700000000000003">Процесс TP rank 1</tspan>
</text>
<path d="M 460 245 H 740" fill="none" stroke="#0750f5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 740 280 H 460" fill="none" stroke="#0750f5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="600" y="215" font-size="26" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">NVLink / NCCL</tspan>
</text>
<text x="600" y="316" font-size="20" fill="#5e6572" text-anchor="middle">
<tspan x="600" dy="0">Обмен на шагах модели</tspan>
</text>
<text x="48" y="393" font-size="30" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">TP=2 не означает две независимые реплики.</tspan>
</text>
<text x="48" y="433" font-size="23" fill="#252528" text-anchor="start">
<tspan x="48" dy="0">Проверяем архитектуру, квантование, память и связь карт до нагрузки на 50 сессий.</tspan>
</text>
<text x="48" y="472" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">NVLink ускоряет обмен между GPU. CPU KV-offload использует другую иерархию памяти.</tspan>
</text>
</svg>
