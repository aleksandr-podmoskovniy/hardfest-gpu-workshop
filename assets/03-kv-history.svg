<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">KV-кеш: память уже прочитанной истории</title><desc id="desc">KV — Key–Value: ключи и значения токенов, которые нужны для продолжения ответа.</desc>
<defs><marker id="arrow-1554dc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1554dc"/></marker><marker id="arrow-087d78" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087d78"/></marker><marker id="arrow-7041b8" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7041b8"/></marker><marker id="arrow-536278" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536278"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}.formula{font-family:"DejaVu Sans Mono",Menlo,Consolas,monospace}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">KV-кеш: память уже прочитанной истории</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">KV — Key–Value: ключи и значения токенов, которые нужны для продолжения ответа.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="174" width="320" height="146" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="216" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="272">
<tspan x="72" dy="0">История</tspan>
</text>
<text x="72" y="256" font-size="22" fill="#17243b" text-anchor="start" data-max-width="272">
<tspan x="72" dy="0">Документ + вопрос</tspan>
<tspan x="72" dy="30.799999999999997">Уже обработанные токены</tspan>
</text>
<rect x="440" y="174" width="320" height="146" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="464" y="216" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="272">
<tspan x="464" dy="0">Сохранённые K и V</tspan>
</text>
<text x="464" y="256" font-size="22" fill="#17243b" text-anchor="start" data-max-width="272">
<tspan x="464" dy="0">Не вычисляем заново</tspan>
<tspan x="464" dy="30.799999999999997">при каждом продолжении</tspan>
</text>
<rect x="832" y="174" width="320" height="146" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="856" y="216" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="272">
<tspan x="856" dy="0">Следующий токен</tspan>
</text>
<text x="856" y="256" font-size="22" fill="#17243b" text-anchor="start" data-max-width="272">
<tspan x="856" dy="0">Использует прошлые K/V</tspan>
<tspan x="856" dy="30.799999999999997">Добавляет свои K/V</tspan>
</text>
<path d="M374 247.0 L434 247.0" fill="none" stroke="#1554dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-1554dc)" data-connector="true"/>
<path d="M766 247.0 L826 247.0" fill="none" stroke="#087d78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-087d78)" data-connector="true"/>
<text x="48" y="386" font-size="28" fill="#17243b" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Что меняется при удлинении истории</tspan>
</text>
<text x="48" y="436" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Full attention</tspan>
</text>
<rect x="360" y="403" width="88" height="50" rx="8" fill="#eef4ff" stroke="#1554dc" stroke-width="1.5"/>
<rect x="460" y="403" width="88" height="50" rx="8" fill="#eef4ff" stroke="#1554dc" stroke-width="1.5"/>
<rect x="560" y="403" width="88" height="50" rx="8" fill="#eef4ff" stroke="#1554dc" stroke-width="1.5"/>
<rect x="660" y="403" width="88" height="50" rx="8" fill="#eef4ff" stroke="#1554dc" stroke-width="1.5"/>
<rect x="760" y="403" width="88" height="50" rx="8" fill="#eef4ff" stroke="#1554dc" stroke-width="1.5"/>
<rect x="860" y="403" width="88" height="50" rx="8" fill="#eef4ff" stroke="#1554dc" stroke-width="1.5"/>
<rect x="960" y="403" width="88" height="50" rx="8" fill="#eef4ff" stroke="#1554dc" stroke-width="1.5"/>
<text x="360" y="486" font-size="24" fill="#17243b" text-anchor="start" data-max-width="792">
<tspan x="360" dy="0">KV всей истории растёт вместе с ней</tspan>
</text>
<text x="48" y="550" font-size="25" fill="#087d78" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Sliding attention</tspan>
</text>
<rect x="360" y="517" width="88" height="50" rx="8" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="460" y="517" width="88" height="50" rx="8" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="560" y="517" width="88" height="50" rx="8" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="660" y="517" width="88" height="50" rx="8" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="760" y="517" width="88" height="50" rx="8" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" stroke-dasharray="7 5"/>
<rect x="860" y="517" width="88" height="50" rx="8" fill="#eaf7f3" stroke="#087d78" stroke-width="1.5"/>
<rect x="960" y="517" width="88" height="50" rx="8" fill="#eaf7f3" stroke="#087d78" stroke-width="1.5"/>
<text x="360" y="600" font-size="24" fill="#17243b" text-anchor="start" data-max-width="792">
<tspan x="360" dy="0">Хранится только последнее локальное окно</tspan>
</text>
<text x="48" y="660" font-size="25" fill="#17243b" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Веса не растут от длины чата. KV — растёт, но по правилам архитектуры.</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Это кеш состояния, не готовых ответов. Один прямоугольник условно обозначает группу токенов.</tspan>
</text>
</svg>
