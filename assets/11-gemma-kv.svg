<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">KV-кэш Gemma: считаем память</title><desc id="desc">10 слоёв полного внимания + 50 локальных слоёв с окном 1024 токена.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">KV-кэш Gemma: считаем память</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">10 слоёв полного внимания + 50 локальных слоёв с окном 1024 токена.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="160" width="1104" height="120" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="600" y="237" font-size="46" fill="#1554dc" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">KV(S) = 2 × b × [ G(S) + L(S) ]</tspan>
</text>
<rect x="48" y="314" width="532" height="204" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="356" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="484">
<tspan x="72" dy="0">G(S) / полное внимание</tspan>
</text>
<text x="314" y="417" font-size="34" fill="#17243b" text-anchor="middle" font-weight="700">
<tspan x="314" dy="0">10 × 4 × 512 × S</tspan>
</text>
<rect x="620" y="314" width="532" height="204" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="644" y="356" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="484">
<tspan x="644" dy="0">L(S) / локальное внимание</tspan>
</text>
<text x="886" y="417" font-size="34" fill="#17243b" text-anchor="middle" font-weight="700">
<tspan x="886" dy="0">50 × 16 × 256</tspan>
<tspan x="886" dy="47.599999999999994">× min(S, 1024)</tspan>
</text>
<rect x="48" y="554" width="352" height="126" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="596" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="304">
<tspan x="72" dy="0">2</tspan>
</text>
<text x="72" y="636" font-size="22" fill="#17243b" text-anchor="start" data-max-width="304">
<tspan x="72" dy="0">Ключи K</tspan>
<tspan x="72" dy="30.799999999999997">и значения V</tspan>
</text>
<rect x="424" y="554" width="352" height="126" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="448" y="596" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="304">
<tspan x="448" dy="0">b</tspan>
</text>
<text x="448" y="636" font-size="22" fill="#17243b" text-anchor="start" data-max-width="304">
<tspan x="448" dy="0">Байт на элемент</tspan>
<tspan x="448" dy="30.799999999999997">BF16: 2 / FP8: 1</tspan>
</text>
<rect x="800" y="554" width="352" height="126" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="824" y="596" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="304">
<tspan x="824" dy="0">S</tspan>
</text>
<text x="824" y="636" font-size="22" fill="#17243b" text-anchor="start" data-max-width="304">
<tspan x="824" dy="0">Длина истории</tspan>
<tspan x="824" dy="30.799999999999997">Вход + ответ</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="18" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Число слоёв × KV-головы × размерность × токены. Результат в байтах; для GiB делим на 2³⁰.</tspan>
</text>
</svg>
