<text x="256" y="810" font-size="23" fill="#252528" text-anchor="middle">
<tspan x="256" dy="0">предложенные токены</tspan>
</text>
<rect x="504" y="699" width="648" height="124" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="528" y="734" font-size="26" fill="#6844bc" text-anchor="start" font-weight="700">
