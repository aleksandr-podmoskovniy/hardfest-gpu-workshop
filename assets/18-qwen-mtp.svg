<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
<title id="title">MTP в Qwen: проверка предложенного продолжения</title><desc id="desc">Условный цикл с четырьмя предложениями. Число принятых токенов здесь не является замером.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="928" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">MTP в Qwen: проверка предложенного продолжения</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Условный цикл с четырьмя предложениями. Число принятых токенов здесь не является замером.</tspan>
</text>
<rect x="48" y="143" width="1104" height="76" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="72" y="176" font-size="27" fill="#6844bc" text-anchor="start" font-weight="700">
<tspan x="72" dy="0">Один сервис Qwen TP2</tspan>
</text>
<text x="72" y="206" font-size="23" fill="#252528" text-anchor="start">
<tspan x="72" dy="0">Встроенный MTP-блок предлагает токены; основная модель проверяет их пакетом.</tspan>
</text>
<text x="48" y="283" font-size="25" fill="#6844bc" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">MTP</tspan>
<tspan x="48" dy="33.75">предлагает</tspan>
</text>
