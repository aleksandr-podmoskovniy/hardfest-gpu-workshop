<text x="633" y="616" font-size="32" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="633" dy="0">t₂</tspan>
</text>
<rect x="748" y="570" width="174" height="68" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="835" y="616" font-size="32" fill="#0750f5" text-anchor="middle" font-weight="700">
