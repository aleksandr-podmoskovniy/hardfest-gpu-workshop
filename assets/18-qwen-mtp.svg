</text>
<path d="M 562 782 H 1094" fill="none" stroke="#6844bc" stroke-width="2" stroke-linejoin="round"/>
<text x="828" y="810" font-size="23" fill="#252528" text-anchor="middle">
<tspan x="828" dy="0">выданные токены</tspan>
</text>
<text x="48" y="872" font-size="26" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Acceptance ≠ ускорение: сравниваем TPOT и токены/с при той же нагрузке.</tspan>
</text>
<text x="48" y="902" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">Старт: num_speculative_tokens=1. Qwen ± MTP: те же вход, выход, TP2 и кэш.</tspan>
