<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">Qwen MTP: предложить и проверить</title><desc id="desc">Черновой блок входит в checkpoint. Условный пример с четырьмя предложениями.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">Qwen MTP: предложить и проверить</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Черновой блок входит в checkpoint. Условный пример с четырьмя предложениями.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="226" font-size="25" fill="#7041b8" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">MTP</tspan>
</text>
<rect x="352" y="183" width="174" height="70" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="439" y="228" font-size="25" fill="#7041b8" text-anchor="middle" font-weight="700">
<tspan x="439" dy="0">t₁</tspan>
</text>
<path d="M439 255 V304" fill="none" stroke="#536278" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="554" y="183" width="174" height="70" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="641" y="228" font-size="25" fill="#7041b8" text-anchor="middle" font-weight="700">
<tspan x="641" dy="0">t₂</tspan>
</text>
<path d="M641 255 V304" fill="none" stroke="#536278" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="756" y="183" width="174" height="70" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="843" y="228" font-size="25" fill="#7041b8" text-anchor="middle" font-weight="700">
<tspan x="843" dy="0">t₃</tspan>
</text>
<path d="M843 255 V304" fill="none" stroke="#536278" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="958" y="183" width="174" height="70" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="1045" y="228" font-size="25" fill="#7041b8" text-anchor="middle" font-weight="700">
<tspan x="1045" dy="0">t₄</tspan>
</text>
<path d="M1045 255 V304" fill="none" stroke="#536278" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="48" y="351" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Проверка</tspan>
</text>
<rect x="352" y="308" width="174" height="70" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="439" y="353" font-size="25" fill="#087d78" text-anchor="middle" font-weight="700">
<tspan x="439" dy="0">Принят</tspan>
</text>
<rect x="554" y="308" width="174" height="70" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="641" y="353" font-size="25" fill="#087d78" text-anchor="middle" font-weight="700">
<tspan x="641" dy="0">Принят</tspan>
</text>
<rect x="756" y="308" width="174" height="70" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="843" y="353" font-size="25" fill="#946017" text-anchor="middle" font-weight="700">
<tspan x="843" dy="0">Отказ</tspan>
</text>
<rect x="958" y="308" width="174" height="70" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="1045" y="353" font-size="25" fill="#946017" text-anchor="middle" font-weight="700">
<tspan x="1045" dy="0">Отбросить</tspan>
</text>
<rect x="48" y="423" width="1104" height="100" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="465" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">В ответ: t₁ + t₂ + исправление основной модели</tspan>
</text>
<text x="72" y="505" font-size="22" fill="#17243b" text-anchor="start" data-max-width="1056">
<tspan x="72" dy="0">Первый отказ отменяет остаток; следующий цикл продолжает принятый текст.</tspan>
</text>
<rect x="48" y="549" width="432" height="132" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="584" font-size="24" fill="#087d78" text-anchor="start" font-weight="700">
<tspan x="72" dy="0">Доля принятия</tspan>
</text>
<text x="264.0" y="620" font-size="23" fill="#17243b" text-anchor="middle">
<tspan x="264.0" dy="0">принятые токены</tspan>
</text>
<path d="M88 631 H440" fill="none" stroke="#087d78" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="264.0" y="662" font-size="23" fill="#17243b" text-anchor="middle">
<tspan x="264.0" dy="0">предложенные токены</tspan>
</text>
<rect x="520" y="549" width="632" height="132" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="544" y="584" font-size="24" fill="#7041b8" text-anchor="start" font-weight="700">
<tspan x="544" dy="0">Время на выданный токен</tspan>
</text>
<text x="836.0" y="620" font-size="23" fill="#17243b" text-anchor="middle">
<tspan x="836.0" dy="0">предложение + проверка + обмен</tspan>
</text>
<path d="M560 631 H1112" fill="none" stroke="#7041b8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="836.0" y="662" font-size="23" fill="#17243b" text-anchor="middle">
<tspan x="836.0" dy="0">выданные токены</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="18" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">В профиле стартуем с num_speculative_tokens=1. Сравниваем MTP on/off при одинаковой нагрузке.</tspan>
</text>
</svg>
