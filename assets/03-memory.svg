<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Во что обходится длинный контекст</title><desc id="desc">Gemma 4 31B. Полезные KV-данные одной истории; округления пула не включены.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="818" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">Во что обходится длинный контекст</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Gemma 4 31B. Полезные KV-данные одной истории; округления пула не включены.</tspan>
</text>
<rect x="48" y="141" width="1104" height="143" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="600" y="197" font-size="38" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">HBM × бюджет − веса − runtime = KV-пул</tspan>
</text>
<text x="600" y="251" font-size="26" fill="#252528" text-anchor="middle">
<tspan x="600" dy="0">В нашем запуске веса заняли 57,91 GiB — и у A, и у B.</tspan>
</text>
<text x="76" y="348" font-size="22" fill="#5e6572" text-anchor="start" font-weight="700">
<tspan x="76" dy="0">ИСТОРИЯ</tspan>
</text>
<text x="510" y="348" font-size="22" fill="#5e6572" text-anchor="middle" font-weight="700">
<tspan x="510" dy="0">BF16 / 2 байта</tspan>
</text>
<text x="946" y="348" font-size="22" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="946" dy="0">FP8 / 1 байт</tspan>
</text>
<rect x="48" y="385" width="1104" height="99" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="754" y="385" width="398" height="99" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="78" y="449" font-size="42" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="78" dy="0">64K</tspan>
</text>
<text x="510" y="449" font-size="44" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="510" dy="0">5,78 GiB</tspan>
</text>
<text x="946" y="449" font-size="44" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="946" dy="0">2,89 GiB</tspan>
</text>
<rect x="48" y="509" width="1104" height="99" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="754" y="509" width="398" height="99" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="78" y="573" font-size="42" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="78" dy="0">128K</tspan>
</text>
<text x="510" y="573" font-size="44" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="510" dy="0">10,78 GiB</tspan>
</text>
<text x="946" y="573" font-size="44" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="946" dy="0">5,39 GiB</tspan>
</text>
<rect x="48" y="633" width="1104" height="99" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="754" y="633" width="398" height="99" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="78" y="697" font-size="42" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="78" dy="0">256K</tspan>
</text>
<text x="510" y="697" font-size="44" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="510" dy="0">20,78 GiB</tspan>
</text>
<text x="946" y="697" font-size="44" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="946" dy="0">10,39 GiB</tspan>
</text>
<text x="48" y="792" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">Длина истории = вход + генерация. 256K здесь — расчёт, не подтверждённый запуск.</tspan>
</text>
</svg>
