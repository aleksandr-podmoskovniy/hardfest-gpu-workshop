<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">Наращиваем нагрузку: 1 → 2 → 4 → 8</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Одинаковые вход, выход, TP2, MTP и состояние кэша на каждой ступени нагрузки.</tspan>
</text>
