<rect x="48" y="331" width="258" height="140" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="373" font-size="25" fill="#946017" text-anchor="start" font-weight="700" data-max-width="210">
<tspan x="72" dy="0">Очередь</tspan>
</text>
<text x="72" y="413" font-size="22" fill="#17243b" text-anchor="start" data-max-width="210">
<tspan x="72" dy="0">Стабильна</tspan>
<tspan x="72" dy="30.799999999999997">или растёт?</tspan>
</text>
<rect x="330" y="331" width="258" height="140" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="354" y="373" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="210">
<tspan x="354" dy="0">TTFT</tspan>
</text>
<text x="354" y="413" font-size="22" fill="#17243b" text-anchor="start" data-max-width="210">
<tspan x="354" dy="0">До первого токена</tspan>
<tspan x="354" dy="30.799999999999997">p50 / p95 / p99</tspan>
</text>
<rect x="612" y="331" width="258" height="140" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="636" y="373" font-size="25" fill="#7041b8" text-anchor="start" font-weight="700" data-max-width="210">
<tspan x="636" dy="0">TPOT</tspan>
</text>
<text x="636" y="413" font-size="22" fill="#17243b" text-anchor="start" data-max-width="210">
<tspan x="636" dy="0">Время на токен</tspan>
<tspan x="636" dy="30.799999999999997">p50 / p95 / p99</tspan>
</text>
<rect x="894" y="331" width="258" height="140" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="918" y="373" font-size="25" fill="#946017" text-anchor="start" font-weight="700" data-max-width="210">
<tspan x="918" dy="0">Ошибки</tspan>
</text>
<text x="918" y="413" font-size="22" fill="#17243b" text-anchor="start" data-max-width="210">
<tspan x="918" dy="0">HTTP, timeout, OOM</tspan>
<tspan x="918" dy="30.799999999999997">Считаем все отказы</tspan>
</text>
<rect x="48" y="515" width="532" height="123" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="557" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="484">
<tspan x="72" dy="0">Пороги соблюдены</tspan>
</text>
<text x="72" y="597" font-size="22" fill="#17243b" text-anchor="start" data-max-width="484">
<tspan x="72" dy="0">Следующая ступень нагрузки</tspan>
</text>
<rect x="620" y="515" width="532" height="123" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="644" y="557" font-size="25" fill="#946017" text-anchor="start" font-weight="700" data-max-width="484">
<tspan x="644" dy="0">Хотя бы один порог нарушен</tspan>
</text>
<text x="644" y="597" font-size="22" fill="#17243b" text-anchor="start" data-max-width="484">
<tspan x="644" dy="0">Остановить рост нагрузки</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Восемь активных запросов ≠ восемь полностью заполненных контекстных окон.</tspan>
</text>
