<tspan x="438" dy="0">4</tspan>
</text>
<path d="M508 246 H530" fill="none" stroke="#1554dc" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="534" y="207" width="132" height="78" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="600" y="260" font-size="39" fill="#1554dc" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">8</tspan>
</text>
<path d="M670 246 H692" fill="none" stroke="#1554dc" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
