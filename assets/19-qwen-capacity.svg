<rect x="624" y="207" width="240" height="78" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="744" y="260" font-size="42" fill="#1554dc" text-anchor="middle" font-weight="700" class="formula">
<tspan x="744" dy="0">4</tspan>
</text>
<path d="M870 246.0 L906 246.0" fill="none" stroke="#1554dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-1554dc)" data-connector="true"/>
<rect x="912" y="207" width="240" height="78" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="1032" y="260" font-size="42" fill="#1554dc" text-anchor="middle" font-weight="700" class="formula">
<tspan x="1032" dy="0">8</tspan>
