<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">Поиск и генерация — разные сервисы</title><desc id="desc">Индексирование выполняется при загрузке документов; поиск — при вопросе пользователя.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">Поиск и генерация — разные сервисы</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Индексирование выполняется при загрузке документов; поиск — при вопросе пользователя.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="170" width="352" height="118" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="212" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="304">
<tspan x="72" dy="0">Документы</tspan>
</text>
<text x="72" y="252" font-size="22" fill="#17243b" text-anchor="start" data-max-width="304">
<tspan x="72" dy="0">Разбивка на фрагменты</tspan>
</text>
<path d="M404 232 H420" fill="none" stroke="#087d78" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="424" y="170" width="352" height="118" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="448" y="212" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="304">
<tspan x="448" dy="0">Эмбеддер</tspan>
</text>
<text x="448" y="252" font-size="22" fill="#17243b" text-anchor="start" data-max-width="304">
<tspan x="448" dy="0">Фрагменты → векторы</tspan>
</text>
<path d="M780 232 H796" fill="none" stroke="#087d78" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="800" y="170" width="352" height="118" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="824" y="212" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="304">
<tspan x="824" dy="0">Индекс</tspan>
</text>
<text x="824" y="252" font-size="22" fill="#17243b" text-anchor="start" data-max-width="304">
<tspan x="824" dy="0">Векторы и источники</tspan>
</text>
<rect x="48" y="394" width="246" height="126" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="68" y="438" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="68" dy="0">Вопрос</tspan>
</text>
<text x="68" y="484" font-size="21" fill="#17243b" text-anchor="start">
<tspan x="68" dy="0">Эмбеддер вопроса</tspan>
</text>
<path d="M298 456 H330" fill="none" stroke="#1554dc" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="334" y="394" width="246" height="126" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="354" y="438" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="354" dy="0">Поиск</tspan>
</text>
<text x="354" y="484" font-size="21" fill="#17243b" text-anchor="start">
<tspan x="354" dy="0">Кандидаты</tspan>
</text>
<path d="M584 456 H616" fill="none" stroke="#1554dc" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="620" y="394" width="246" height="126" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="640" y="438" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="640" dy="0">Реранкер</tspan>
</text>
<text x="640" y="484" font-size="21" fill="#17243b" text-anchor="start">
<tspan x="640" dy="0">Отбор фрагментов</tspan>
</text>
<path d="M870 456 H902" fill="none" stroke="#1554dc" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="906" y="394" width="246" height="126" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="926" y="438" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="926" dy="0">LLM</tspan>
</text>
<text x="926" y="484" font-size="21" fill="#17243b" text-anchor="start">
<tspan x="926" dy="0">Вопрос + контекст</tspan>
</text>
<path d="M976 290 V336 H457 V390" fill="none" stroke="#087d78" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="694" y="363" font-size="21" fill="#087d78" text-anchor="middle">
<tspan x="694" dy="0">Поиск похожих векторов</tspan>
</text>
<rect x="48" y="566" width="1104" height="100" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="608" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">LLM можно заменить без пересоздания индекса</tspan>
</text>
<text x="72" y="648" font-size="22" fill="#17243b" text-anchor="start" data-max-width="1056">
<tspan x="72" dy="0">При смене эмбеддера документы нужно переиндексировать.</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="18" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Проверяем не только ответ: нужный документ должен попасть в контекст, а ссылка — вести к источнику.</tspan>
</text>
</svg>
