<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">Helm в Git, доставка через Argo CD</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Редактируем values, отправляем коммит и применяем его через Argo CD.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="160" width="528" height="168" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="202" font-size="25" fill="#536278" text-anchor="start" font-weight="700" data-max-width="480">
<tspan x="72" dy="0">GitHub / исходники</tspan>
</text>
<text x="72" y="242" font-size="22" fill="#17243b" text-anchor="start" data-max-width="480">
<tspan x="72" dy="0">Helm-чарты</tspan>
<tspan x="72" dy="30.799999999999997">Профили экспериментов</tspan>
<tspan x="72" dy="30.799999999999997">Примеры настройки</tspan>
</text>
<rect x="624" y="160" width="528" height="168" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="648" y="202" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="480">
<tspan x="648" dy="0">GitLab / k8s-config</tspan>
</text>
<text x="648" y="242" font-size="22" fill="#17243b" text-anchor="start" data-max-width="480">
<tspan x="648" dy="0">Чарт + values + настройки площадки</tspan>
<tspan x="648" dy="30.799999999999997">Проверка diff → commit → push</tspan>
<tspan x="648" dy="30.799999999999997">Источник для Argo CD</tspan>
</text>
<rect x="48" y="424" width="528" height="168" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="466" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="480">
<tspan x="72" dy="0">Argo CD / управляющий кластер</tspan>
</text>
<text x="72" y="506" font-size="22" fill="#17243b" text-anchor="start" data-max-width="480">
<tspan x="72" dy="0">Читает выбранный коммит</tspan>
<tspan x="72" dy="30.799999999999997">Рендерит Helm-чарт</tspan>
<tspan x="72" dy="30.799999999999997">Применяет манифесты</tspan>
</text>
<rect x="624" y="424" width="528" height="168" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="648" y="466" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="480">
<tspan x="648" dy="0">GPU-кластер</tspan>
</text>
<text x="648" y="506" font-size="22" fill="#17243b" text-anchor="start" data-max-width="480">
<tspan x="648" dy="0">ConfigMap с параметрами vLLM</tspan>
<tspan x="648" dy="30.799999999999997">Deployment + DRA-заявка</tspan>
<tspan x="648" dy="30.799999999999997">Service + NetworkPolicy</tspan>
</text>
<path d="M582 244.0 L618 244.0" fill="none" stroke="#1554dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-1554dc)" data-connector="true"/>
<path d="M888.0 334 L888.0 368.0 Q888 376 880.0 376.0 L320.0 376.0 Q312 376 312.0 384.0 L312.0 418" fill="none" stroke="#1554dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-1554dc)" data-connector="true"/>
<path d="M582 508.0 L618 508.0" fill="none" stroke="#087d78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-087d78)" data-connector="true"/>
<text x="48" y="651" font-size="28" fill="#17243b" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Новые параметры vLLM → новый Pod → проверка готовности</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">В примерах replicaCount: 0, autosync выключен. Секреты хранятся вне Git.</tspan>
</text>
