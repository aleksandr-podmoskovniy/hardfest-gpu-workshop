<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">Общий смысл не равен общему префиксу</title><desc id="desc">Повторно используются KV-блоки совпадающей последовательности токенов с начала запроса.</desc>
