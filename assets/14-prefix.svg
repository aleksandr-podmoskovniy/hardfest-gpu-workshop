<path d="M230 282 V293 H870 V282" fill="none" stroke="#087d78" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="579" width="1104" height="100" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="621" font-size="25" fill="#946017" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">Изменение начала разрывает совпадение префикса</tspan>
