<tspan x="377.0" dy="0">Общий system</tspan>
</text>
<rect x="546" y="318" width="324" height="80" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="708.0" y="367" font-size="25" fill="#087d78" text-anchor="middle" font-weight="700">
