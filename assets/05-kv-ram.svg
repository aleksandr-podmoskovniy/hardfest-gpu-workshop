<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">Сохранить KV в RAM и вернуть на GPU</title><desc id="desc">Повтор документа после вытеснения: X → другие документы → X.</desc>
<defs><marker id="arrow-1554dc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1554dc"/></marker><marker id="arrow-087d78" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087d78"/></marker><marker id="arrow-7041b8" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7041b8"/></marker><marker id="arrow-536278" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536278"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">Сохранить KV в RAM и вернуть на GPU</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Повтор документа после вытеснения: X → другие документы → X.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="260" y="180" font-size="22" fill="#1554dc" text-anchor="middle" font-weight="700">
<tspan x="260" dy="0">GPU</tspan>
</text>
<text x="920" y="180" font-size="22" fill="#087d78" text-anchor="middle" font-weight="700">
<tspan x="920" dy="0">RAM</tspan>
</text>
<text x="48" y="202" font-size="19" fill="#536278" text-anchor="start">
<tspan x="48" dy="0">1. Обработать X</tspan>
</text>
<rect x="48" y="216" width="432" height="96" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="258" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="384">
<tspan x="72" dy="0">KV документа X</tspan>
</text>
<rect x="720" y="216" width="432" height="96" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="744" y="258" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="384">
<tspan x="744" dy="0">Копия KV документа X</tspan>
</text>
<text x="48" y="346" font-size="19" fill="#536278" text-anchor="start">
<tspan x="48" dy="0">2. Вытеснить X</tspan>
</text>
<rect x="48" y="360" width="432" height="96" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="402" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="384">
<tspan x="72" dy="0">KV документов Y, Z</tspan>
</text>
<rect x="720" y="360" width="432" height="96" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="744" y="402" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="384">
<tspan x="744" dy="0">Копия X остаётся</tspan>
</text>
<text x="48" y="490" font-size="19" fill="#536278" text-anchor="start">
<tspan x="48" dy="0">3. Повторить X</tspan>
</text>
<rect x="48" y="504" width="432" height="96" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="546" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="384">
<tspan x="72" dy="0">KV X снова на GPU</tspan>
</text>
<rect x="720" y="504" width="432" height="96" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="744" y="546" font-size="25" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="384">
<tspan x="744" dy="0">Найденные блоки X</tspan>
</text>
<path d="M486 264.0 L714 264.0" fill="none" stroke="#087d78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-087d78)" data-connector="true"/>
<text x="600" y="245" font-size="22" fill="#087d78" text-anchor="middle">
<tspan x="600" dy="0">Запись</tspan>
</text>
<text x="600" y="415" font-size="21" fill="#536278" text-anchor="middle">
<tspan x="600" dy="0">Другие запросы</tspan>
</text>
<path d="M714 552.0 L486 552.0" fill="none" stroke="#1554dc" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-1554dc)" data-connector="true"/>
<text x="600" y="533" font-size="22" fill="#1554dc" text-anchor="middle">
<tspan x="600" dy="0">Чтение</tspan>
</text>
<text x="48" y="660" font-size="26" fill="#17243b" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Проверяем CPU → GPU байты и отсутствие локального cache hit.</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">RAM хранит KV между запросами. Для вычисления нужные блоки возвращаются на GPU.</tspan>
</text>
</svg>
