<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
<title id="title">RAM сохраняет KV для повторного обращения</title><desc id="desc">Пример X → другие документы → X. Это схема эксперимента, не результат замера.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="668" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">RAM сохраняет KV для повторного обращения</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Пример X → другие документы → X. Это схема эксперимента, не результат замера.</tspan>
</text>
<text x="279" y="156" font-size="28" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="279" dy="0">GPU</tspan>
</text>
<text x="905" y="156" font-size="28" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="905" dy="0">RAM</tspan>
</text>
<text x="48" y="173" font-size="22" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">1. Обработать X</tspan>
</text>
<rect x="48" y="185" width="454" height="94" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="70" y="224" font-size="27" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="70" dy="0">KV документа X</tspan>
</text>
<rect x="726" y="185" width="426" height="94" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="748" y="224" font-size="27" fill="#177c83" text-anchor="start" font-weight="700">
<tspan x="748" dy="0">Копия KV документа X</tspan>
</text>
<path d="M 504 230 H 724" fill="none" stroke="#177c83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="614" y="214" font-size="22" fill="#177c83" text-anchor="middle">
<tspan x="614" dy="0">Запись</tspan>
</text>
<text x="48" y="314" font-size="22" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">2. Вытеснить X</tspan>
</text>
<rect x="48" y="326" width="454" height="94" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="70" y="365" font-size="27" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="70" dy="0">KV документов Y, Z</tspan>
</text>
<rect x="726" y="326" width="426" height="94" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="748" y="365" font-size="27" fill="#177c83" text-anchor="start" font-weight="700">
<tspan x="748" dy="0">Копия X остаётся</tspan>
</text>
<text x="614" y="371" font-size="21" fill="#5e6572" text-anchor="middle">
<tspan x="614" dy="0">Другие запросы</tspan>
</text>
<text x="48" y="455" font-size="22" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">3. Повторить X</tspan>
</text>
<rect x="48" y="467" width="454" height="94" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="70" y="506" font-size="27" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="70" dy="0">KV X снова в GPU</tspan>
</text>
<rect x="726" y="467" width="426" height="94" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="748" y="506" font-size="27" fill="#177c83" text-anchor="start" font-weight="700">
<tspan x="748" dy="0">Найденные блоки X</tspan>
</text>
<path d="M 724 512 H 504" fill="none" stroke="#0750f5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="614" y="496" font-size="22" fill="#0750f5" text-anchor="middle">
<tspan x="614" dy="0">Загрузка</tspan>
</text>
<text x="48" y="608" font-size="27" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Доказательство: запись → вытеснение из GPU → чтение из RAM.</tspan>
</text>
<text x="48" y="642" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">Быстрый повтор сам по себе не доказывает offload. Во время вычисления рабочий KV нужен на GPU.</tspan>
</text>
</svg>
