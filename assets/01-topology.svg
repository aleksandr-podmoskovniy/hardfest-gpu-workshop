<tspan x="750" dy="29.700000000000003">Динамический MIG + MPS</tspan>
</text>
<path d="M 674 351 V 502 H 726" fill="none" stroke="#177c83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="380" width="250" height="144" rx="14" fill="#f1f4f8" stroke="#5e6572" stroke-width="2"/>
<text x="70" y="419" font-size="27" fill="#5e6572" text-anchor="start" font-weight="700">
<tspan x="70" dy="0">База знаний</tspan>
</text>
<text x="70" y="456" font-size="22" fill="#252528" text-anchor="start">
<tspan x="70" dy="0">Документы и индекс</tspan>
<tspan x="70" dy="29.700000000000003">сохраняются при</tspan>
<tspan x="70" dy="29.700000000000003">смене сервера LLM</tspan>
</text>
<path d="M 174 290 V 378" fill="none" stroke="#5e6572" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="378" y="442" width="254" height="126" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="400" y="479" font-size="26" fill="#6844bc" text-anchor="start" font-weight="700">
<tspan x="400" dy="0">OIDC / MCP</tspan>
</text>
<text x="400" y="516" font-size="21" fill="#252528" text-anchor="start">
<tspan x="400" dy="0">Персональные права</tspan>
<tspan x="400" dy="28.35">на инструменты</tspan>
</text>
<path d="M 505 290 V 440" fill="none" stroke="#6844bc" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 6"/>
<rect x="48" y="606" width="1104" height="50" rx="14" fill="#f1f4f8" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="638" font-size="24" fill="#252528" text-anchor="start">
<tspan x="70" dy="0">Бонус после A/B: обе H100 освобождаются под один Qwen TP2.</tspan>
</text>
<text x="48" y="682" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">Внешний пользователь не подключается к vLLM напрямую. Стрелки показывают обращения к сервисам.</tspan>
</text>
</svg>
