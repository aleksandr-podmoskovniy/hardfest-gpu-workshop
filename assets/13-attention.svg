<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Зачем сохранять ключи и значения</title><desc id="desc">Упрощённый шаг attention: запрос текущего токена обращается к истории.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="738" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">Зачем сохранять ключи и значения</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Упрощённый шаг attention: запрос текущего токена обращается к истории.</tspan>
</text>
<rect x="48" y="162" width="280" height="143" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="70" y="201" font-size="27" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="70" dy="0">Текущий токен</tspan>
</text>
<text x="70" y="238" font-size="22" fill="#252528" text-anchor="start">
<tspan x="70" dy="0">Q — запрос</tspan>
<tspan x="70" dy="29.700000000000003">Нужен сейчас</tspan>
</text>
<rect x="410" y="162" width="332" height="143" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="432" y="201" font-size="27" fill="#177c83" text-anchor="start" font-weight="700">
<tspan x="432" dy="0">Прошлые токены</tspan>
</text>
<text x="432" y="238" font-size="22" fill="#252528" text-anchor="start">
<tspan x="432" dy="0">K — ключи</tspan>
<tspan x="432" dy="29.700000000000003">V — значения</tspan>
</text>
<rect x="826" y="162" width="326" height="143" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="848" y="201" font-size="27" fill="#177c83" text-anchor="start" font-weight="700">
<tspan x="848" dy="0">KV-кэш</tspan>
</text>
<text x="848" y="238" font-size="22" fill="#252528" text-anchor="start">
<tspan x="848" dy="0">Сохраняет K и V</tspan>
<tspan x="848" dy="29.700000000000003">для следующих шагов</tspan>
</text>
<path d="M 744 232 H 824" fill="none" stroke="#177c83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="365" width="1104" height="234" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="600" y="422" font-size="36" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">Attention(Q, K, V) =</tspan>
</text>
<text x="600" y="506" font-size="57" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">softmax( QKᵀ / √d ) V</tspan>
</text>
<text x="600" y="565" font-size="26" fill="#5e6572" text-anchor="middle">
<tspan x="600" dy="0">Сравнить Q с ключами → получить веса → смешать значения</tspan>
</text>
<path d="M 188 307 V 363" fill="none" stroke="#0750f5" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 576 307 V 363" fill="none" stroke="#177c83" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="48" y="657" font-size="29" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Кэш хранит промежуточные тензоры, не готовые ответы.</tspan>
</text>
<text x="48" y="712" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">d — размерность головы. Маски и детали конкретной архитектуры здесь опущены.</tspan>
</text>
</svg>
