<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">GPT-OSS-120B: расчёт из презентации</title><desc id="desc">Отдельный учебный пример. Эти числа не подставляются в профиль Gemma.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="868" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">GPT-OSS-120B: расчёт из презентации</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Отдельный учебный пример. Эти числа не подставляются в профиль Gemma.</tspan>
</text>
<rect x="48" y="150" width="1104" height="130" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="600" y="202" font-size="25" fill="#5e6572" text-anchor="middle">
<tspan x="600" dy="0">Один токен одного слоя: K/V × головы × размер × байты</tspan>
</text>
<text x="600" y="253" font-size="40" fill="#0750f5" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">2 × 8 × 64 × 2 = 2048 байт = 2 KiB</tspan>
</text>
<rect x="48" y="315" width="1104" height="179" rx="14" fill="#ffffff" stroke="#0750f5" stroke-width="2"/>
<text x="600" y="371" font-size="27" fill="#5e6572" text-anchor="middle">
<tspan x="600" dy="0">18 полных слоёв + 18 локальных с окном 128</tspan>
</text>
<text x="600" y="441" font-size="40" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">KV(S) = 2 KiB × [18S + 18 min(S, 128)]</tspan>
</text>
<rect x="48" y="536" width="352" height="145" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="224" y="580" font-size="25" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="224" dy="0">Одна история 128K</tspan>
</text>
<text x="224" y="642" font-size="38" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="224" dy="0">4,5044 GiB</tspan>
</text>
<rect x="424" y="536" width="352" height="145" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="600" y="580" font-size="25" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">Четыре истории</tspan>
</text>
<text x="600" y="642" font-size="38" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">18,02 GiB</tspan>
</text>
<rect x="800" y="536" width="352" height="145" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="976" y="580" font-size="25" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="976" dy="0">Восемь историй</tspan>
</text>
<text x="976" y="642" font-size="38" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="976" dy="0">36,04 GiB</tspan>
</text>
<text x="600" y="742" font-size="29" fill="#252528" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">Условный KV-пул: 96 × 0,90 − 64 − 6 = 16,4 GiB</tspan>
</text>
<text x="600" y="789" font-size="28" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="600" dy="0">Три полные истории помещаются, четыре — уже нет.</tspan>
</text>
<text x="48" y="842" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">96 GiB — условие задачи, не замер GPU стенда. Учтены полезные KV без выравнивания и рабочих буферов.</tspan>
</text>
</svg>
