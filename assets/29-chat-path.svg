</text>
<text x="72" y="290" font-size="22" fill="#17243b" text-anchor="start" data-max-width="272">
<tspan x="72" dy="0">Сообщение, документ</tspan>
<tspan x="72" dy="30.799999999999997">или голосовой вопрос</tspan>
</text>
<rect x="440" y="208" width="320" height="160" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
