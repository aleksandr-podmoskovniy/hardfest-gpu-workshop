<tspan x="70" dy="0">От сообщения до ответа модели</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Чат один; шлюз направляет запрос выбранной модели.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="208" width="320" height="160" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="250" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="272">
