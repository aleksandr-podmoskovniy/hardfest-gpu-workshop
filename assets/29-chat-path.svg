</text>
<text x="464" y="290" font-size="22" fill="#17243b" text-anchor="start" data-max-width="272">
<tspan x="464" dy="0">Проверяет доступ</tspan>
<tspan x="464" dy="30.799999999999997">Выбирает маршрут</tspan>
</text>
<rect x="832" y="208" width="320" height="160" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="856" y="250" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="272">
<tspan x="856" dy="0">vLLM / GPU</tspan>
</text>
<text x="856" y="290" font-size="22" fill="#17243b" text-anchor="start" data-max-width="272">
<tspan x="856" dy="0">Gemma A или B</tspan>
