<path d="M600.0 374 L600.0 529.0 Q600 537 608.0 537.0 L826 537.0" fill="none" stroke="#087d78" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-087d78)" data-connector="true"/>
