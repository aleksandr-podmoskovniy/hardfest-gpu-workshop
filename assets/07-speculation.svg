<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Черновик предлагает, основная модель проверяет</title><desc id="desc">Условный цикл speculative decoding. Три принятых токена — пример, не измеренная доля.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif} .title{font-weight:700} </style>
<rect x="1" y="1" width="1198" height="618" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<rect x="40" y="36" width="7" height="42" rx="3" fill="#0750f5" stroke="#0750f5" stroke-width="2"/>
<text x="64" y="66" font-size="34" fill="#252528" text-anchor="start" font-weight="700">
<tspan x="64" dy="0">Черновик предлагает, основная модель проверяет</tspan>
</text>
<text x="64" y="104" font-size="21" fill="#5e6572" text-anchor="start">
<tspan x="64" dy="0">Условный цикл speculative decoding. Три принятых токена — пример, не измеренная доля.</tspan>
</text>
<text x="48" y="178" font-size="26" fill="#6844bc" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Черновик</tspan>
</text>
<rect x="288" y="141" width="142" height="66" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="359" y="184" font-size="30" fill="#6844bc" text-anchor="middle" font-weight="700">
<tspan x="359" dy="0">A</tspan>
</text>
<path d="M 359 209 V 260" fill="none" stroke="#5e6572" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="456" y="141" width="142" height="66" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="527" y="184" font-size="30" fill="#6844bc" text-anchor="middle" font-weight="700">
<tspan x="527" dy="0">B</tspan>
</text>
<path d="M 527 209 V 260" fill="none" stroke="#5e6572" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="624" y="141" width="142" height="66" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="695" y="184" font-size="30" fill="#6844bc" text-anchor="middle" font-weight="700">
<tspan x="695" dy="0">C</tspan>
</text>
<path d="M 695 209 V 260" fill="none" stroke="#5e6572" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="792" y="141" width="142" height="66" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="863" y="184" font-size="30" fill="#6844bc" text-anchor="middle" font-weight="700">
<tspan x="863" dy="0">D</tspan>
</text>
<path d="M 863 209 V 260" fill="none" stroke="#5e6572" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="960" y="141" width="142" height="66" rx="14" fill="#efe9fc" stroke="#6844bc" stroke-width="2"/>
<text x="1031" y="184" font-size="30" fill="#6844bc" text-anchor="middle" font-weight="700">
<tspan x="1031" dy="0">E</tspan>
</text>
<path d="M 1031 209 V 260" fill="none" stroke="#5e6572" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="48" y="308" font-size="24" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">Проверка</tspan>
<tspan x="48" dy="32.400000000000006">основной моделью</tspan>
</text>
<rect x="288" y="272" width="142" height="66" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="359" y="315" font-size="30" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="359" dy="0">A</tspan>
</text>
<rect x="456" y="272" width="142" height="66" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="527" y="315" font-size="30" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="527" dy="0">B</tspan>
</text>
<rect x="624" y="272" width="142" height="66" rx="14" fill="#eaf6f5" stroke="#177c83" stroke-width="2"/>
<text x="695" y="315" font-size="30" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="695" dy="0">C</tspan>
</text>
<rect x="792" y="272" width="142" height="66" rx="14" fill="#fff2da" stroke="#a15b0b" stroke-width="2"/>
<text x="863" y="315" font-size="30" fill="#a15b0b" text-anchor="middle" font-weight="700">
<tspan x="863" dy="0">×</tspan>
</text>
<rect x="960" y="272" width="142" height="66" rx="14" fill="#fff2da" stroke="#a15b0b" stroke-width="2"/>
<text x="1031" y="315" font-size="30" fill="#a15b0b" text-anchor="middle" font-weight="700">
<tspan x="1031" dy="0">×</tspan>
</text>
<text x="504" y="377" font-size="23" fill="#177c83" text-anchor="middle" font-weight="700">
<tspan x="504" dy="0">Приняты</tspan>
</text>
<text x="961" y="377" font-size="22" fill="#a15b0b" text-anchor="middle" font-weight="700">
<tspan x="961" dy="0">D и хвост отклонены</tspan>
</text>
<rect x="48" y="414" width="1104" height="100" rx="14" fill="#edf3ff" stroke="#0750f5" stroke-width="2"/>
<text x="72" y="455" font-size="29" fill="#0750f5" text-anchor="start" font-weight="700">
<tspan x="72" dy="0">В ответ: A, B, C + замена от основной модели</tspan>
</text>
<text x="72" y="490" font-size="23" fill="#252528" text-anchor="start">
<tspan x="72" dy="0">Следующий цикл начинается с исправленного продолжения.</tspan>
</text>
<text x="48" y="564" font-size="26" fill="#252528" text-anchor="start">
<tspan x="48" dy="0">Измеряем вместе: принятие, стоимость черновика и итоговую скорость.</tspan>
</text>
<text x="48" y="592" font-size="20" fill="#5e6572" text-anchor="start">
<tspan x="48" dy="0">Высокий acceptance не гарантирует ускорение. Gemma assistant проверяется отдельно от CPU KV-offload.</tspan>
</text>
</svg>
