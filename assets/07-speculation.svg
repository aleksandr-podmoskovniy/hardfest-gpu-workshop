<text x="727" y="258" font-size="30" fill="#7041b8" text-anchor="middle" font-weight="700">
<tspan x="727" dy="0">C</tspan>
</text>
<path d="M727 283 V336" fill="none" stroke="#536278" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="822" y="215" width="150" height="66" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="897" y="258" font-size="30" fill="#7041b8" text-anchor="middle" font-weight="700">
<tspan x="897" dy="0">D</tspan>
