<tspan x="1067" dy="0">×</tspan>
</text>
<rect x="48" y="448" width="1104" height="100" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="490" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">В ответ: A, B, C + исправление основной модели</tspan>
</text>
<text x="72" y="530" font-size="22" fill="#17243b" text-anchor="start" data-max-width="1056">
<tspan x="72" dy="0">Следующий цикл начинается с принятого и исправленного продолжения.</tspan>
</text>
<rect x="48" y="580" width="1104" height="94" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="635" font-size="29" fill="#7041b8" text-anchor="start" font-weight="700">
<tspan x="72" dy="0">Время на токен ≈</tspan>
</text>
<text x="798" y="613" font-size="24" fill="#17243b" text-anchor="middle">
<tspan x="798" dy="0">черновик + проверка + накладные расходы</tspan>
</text>
<path d="M456 628 H1128" fill="none" stroke="#7041b8" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="798" y="660" font-size="25" fill="#17243b" text-anchor="middle" font-weight="700">
<tspan x="798" dy="0">число выданных токенов</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="18" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Принятие токенов на схеме условное. Стоимость черновика тоже входит во время ответа.</tspan>
