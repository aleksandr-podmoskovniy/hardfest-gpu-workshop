<tspan x="557" dy="0">B</tspan>
</text>
<rect x="652" y="340" width="150" height="66" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="727" y="383" font-size="30" fill="#087d78" text-anchor="middle" font-weight="700">
<tspan x="727" dy="0">C</tspan>
</text>
<rect x="822" y="340" width="150" height="66" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="897" y="383" font-size="30" fill="#946017" text-anchor="middle" font-weight="700">
<tspan x="897" dy="0">×</tspan>
</text>
<rect x="992" y="340" width="150" height="66" rx="12" fill="#fff5e4" stroke="#d9e2ee" stroke-width="1.5"/>
