</text>
<text x="48" y="436" font-size="29" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1104">
<tspan x="48" dy="0">8 независимых историй × 128K токенов</tspan>
</text>
<text x="48" y="505" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700">
<tspan x="48" dy="0">BF16</tspan>
</text>
