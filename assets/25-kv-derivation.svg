<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" data-design="hardfest-v2">
<title id="title">От одного токена — к памяти сервиса</title><desc id="desc">Сначала одинаковые full-attention слои, независимые истории и один GPU.</desc>
<defs><marker id="arrow-1554dc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1554dc"/></marker><marker id="arrow-087d78" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087d78"/></marker><marker id="arrow-7041b8" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7041b8"/></marker><marker id="arrow-536278" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#536278"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}</style>
<rect x="1" y="1" width="1198" height="758" rx="20" fill="#ffffff" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="48" y="38" width="5" height="34" rx="2" fill="#1554dc" stroke="#1554dc" stroke-width="1.5"/>
<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">От одного токена — к памяти сервиса</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Сначала одинаковые full-attention слои, независимые истории и один GPU.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="48" y="160" width="1104" height="148" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="190" font-size="19" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">1 ТОКЕН / 1 СЛОЙ</tspan>
</text>
<text x="600" y="245" font-size="39" fill="#1554dc" text-anchor="middle" font-weight="700" data-max-width="1056">
<tspan x="600" dy="0">2 × Hkv × D × b</tspan>
</text>
<text x="600" y="282" font-size="21" fill="#17243b" text-anchor="middle" data-max-width="1056">
<tspan x="600" dy="0">K и V; Hkv голов; D элементов в голове; b байт на элемент.</tspan>
</text>
<rect x="48" y="325" width="1104" height="148" rx="12" fill="#eaf7f3" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="355" font-size="19" fill="#087d78" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">1 ИСТОРИЯ / L СЛОЁВ</tspan>
</text>
<text x="600" y="410" font-size="39" fill="#087d78" text-anchor="middle" font-weight="700" data-max-width="1056">
<tspan x="600" dy="0">2 × S × L × Hkv × D × b</tspan>
</text>
<text x="600" y="447" font-size="21" fill="#17243b" text-anchor="middle" data-max-width="1056">
<tspan x="600" dy="0">S = токены входа + уже сгенерированный ответ.</tspan>
</text>
<rect x="48" y="490" width="1104" height="148" rx="12" fill="#f3eefb" stroke="#d9e2ee" stroke-width="1.5"/>
<text x="72" y="520" font-size="19" fill="#7041b8" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">B НЕЗАВИСИМЫХ ИСТОРИЙ</tspan>
</text>
<text x="600" y="575" font-size="39" fill="#7041b8" text-anchor="middle" font-weight="700" data-max-width="1056">
<tspan x="600" dy="0">Mkv = 2 × B × S × L × Hkv × D × b</tspan>
</text>
<text x="600" y="612" font-size="21" fill="#17243b" text-anchor="middle" data-max-width="1056">
<tspan x="600" dy="0">Результат в байтах. MiB: ÷ 2²⁰. GiB: ÷ 2³⁰.</tspan>
</text>
<text x="48" y="676" font-size="22" fill="#17243b" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Gemma: складываем разные типы слоёв; общий KV не считаем повторно.</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Это полезные K/V, не веса, не буферы prefill и не весь заранее выделенный KV-пул.</tspan>
</text>
</svg>
