</text>
<rect x="48" y="324" width="1104" height="82" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="784" y="324" width="368" height="82" rx="12" fill="#eaf7f3" stroke="#eaf7f3" stroke-width="1.5"/>
<text x="72" y="378" font-size="31" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="380">
<tspan x="72" dy="0">64K / B</tspan>
</text>
<text x="492" y="378" font-size="35" fill="#17243b" text-anchor="middle" font-weight="700">
<tspan x="492" dy="0">390 MiB</tspan>
</text>
<text x="968" y="378" font-size="35" fill="#087d78" text-anchor="middle" font-weight="700">
<tspan x="968" dy="0">195 MiB</tspan>
</text>
