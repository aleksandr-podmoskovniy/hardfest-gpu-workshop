<text x="70" y="64" font-size="32" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="1082">
<tspan x="70" dy="0">Gemma: от контрольного 4K к 128K</tspan>
</text>
<text x="48" y="104" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Полезные KV одной истории E2B. Окно включает и вход, и ответ.</tspan>
</text>
<path d="M48 128 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="72" y="192" font-size="21" fill="#536278" text-anchor="start" font-weight="700">
<tspan x="72" dy="0">ДЛИНА ИСТОРИИ</tspan>
</text>
<text x="492" y="192" font-size="21" fill="#536278" text-anchor="middle" font-weight="700">
<tspan x="492" dy="0">BF16</tspan>
</text>
<text x="968" y="192" font-size="21" fill="#536278" text-anchor="middle" font-weight="700">
<tspan x="968" dy="0">FP8</tspan>
</text>
<rect x="48" y="220" width="1104" height="82" rx="12" fill="#f5f7fa" stroke="#d9e2ee" stroke-width="1.5"/>
<rect x="784" y="220" width="368" height="82" rx="12" fill="#eaf7f3" stroke="#eaf7f3" stroke-width="1.5"/>
