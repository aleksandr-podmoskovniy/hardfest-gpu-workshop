<rect x="784" y="428" width="368" height="82" rx="12" fill="#eaf7f3" stroke="#eaf7f3" stroke-width="1.5"/>
<text x="72" y="482" font-size="31" fill="#17243b" text-anchor="start" font-weight="700" data-max-width="380">
<tspan x="72" dy="0">128K / B</tspan>
</text>
<text x="492" y="482" font-size="35" fill="#17243b" text-anchor="middle" font-weight="700">
<tspan x="492" dy="0">774 MiB</tspan>
</text>
<text x="968" y="482" font-size="35" fill="#087d78" text-anchor="middle" font-weight="700">
<tspan x="968" dy="0">387 MiB</tspan>
</text>
<rect x="48" y="548" width="1104" height="132" rx="12" fill="#eef4ff" stroke="#d9e2ee" stroke-width="1.5" data-node="true"/>
<text x="72" y="590" font-size="25" fill="#1554dc" text-anchor="start" font-weight="700" data-max-width="1056">
<tspan x="72" dy="0">Окно модели ≠ вместимость при любой нагрузке</tspan>
</text>
<text x="72" y="630" font-size="22" fill="#17243b" text-anchor="start" data-max-width="1056">
<tspan x="72" dy="0">Считаем KV всех активных историй, затем добавляем служебную память.</tspan>
<tspan x="72" dy="30.799999999999997">Проверяем длинный вход и параллельные запросы отдельно.</tspan>
</text>
<path d="M48 698 H1152" fill="none" stroke="#d9e2ee" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>
<text x="48" y="731" font-size="20" fill="#536278" text-anchor="start" data-max-width="1104">
<tspan x="48" dy="0">Числа — расчёт, не замер. Нужны ещё память assistant, блоки пула и буферы prefill.</tspan>
</text>
