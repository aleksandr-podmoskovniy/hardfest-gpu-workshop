name: Offline workshop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - uses: azure/setup-helm@v4.3.1
        with:
          version: v3.17.3
      - name: Lint all runtime profiles
        run: |
          for profile in values/*.yaml; do
            helm lint charts/vllm-runtime --strict -f "$profile"
          done
      - name: Lint model catalog
        run: |
          helm lint charts/model-catalog --strict
          helm lint charts/model-catalog --strict -f catalog/models.yaml
          helm lint charts/model-catalog --strict -f catalog/a30.yaml
      - name: Lint all inference orders
        run: |
          for order in platform/*.yaml; do
            helm lint charts/inference-service --strict -f "$order"
          done
      - name: Validate rendered resources and automatic checksums
        run: python3 scripts/check_manifests.py
      - name: Verify committed illustrations match their source
        run: |
          python3 scripts/build_diagrams.py
          git diff --exit-code -- assets/
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_public.py
      - run: python3 scripts/check_docs.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: integrations/webui-access/bridge/go.mod
          cache: false
      - name: Check personal access adapter
        working-directory: integrations/webui-access/bridge
        run: go vet ./... && go test -race ./...
      - name: Lint personal access chart
        run: |
          helm lint charts/webui-access --strict
          helm lint charts/webui-access --strict -f examples/webui-access.yaml
