name: Offline workshop checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Validate plain YAML and profile checksums
        run: python3 scripts/check_manifests.py
      - name: Verify committed illustrations match their source
        run: |
          python3 scripts/build_diagrams.py
          git diff --exit-code -- assets/
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/check_public.py
      - run: python3 scripts/check_docs.py
