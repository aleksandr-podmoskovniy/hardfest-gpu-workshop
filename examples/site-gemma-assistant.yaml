# Private site binding; keep runtime and resource settings in the profile.
nodeSelector:
  kubernetes.io/hostname: REPLACE_H100_NODE
tolerations: []
dra:
  deviceClassName: REPLACE_GENERATED_H100_DEVICECLASS
modelVolumes:
  - name: gemma
    claimName: REPLACE_GEMMA_PVC
    mountPath: /models/gemma
    subPath: REPLACE_GEMMA_MODEL_SUBPATH
  - name: assistant
    claimName: REPLACE_ASSISTANT_PVC
    mountPath: /models/assistant
    subPath: REPLACE_ASSISTANT_MODEL_SUBPATH
networkPolicy:
  extraIngress: []
